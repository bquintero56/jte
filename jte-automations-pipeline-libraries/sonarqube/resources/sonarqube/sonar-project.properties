# sonar-project.properties GENERAL para todos los micros (lo controla el equipo de CI/CD: los desarrolladores no lo editan).
# El pipeline pasa cada propiedad como -D al scanner de Maven: le gana a cualquier <sonar.*> del pom.xml del micro.
# Un micro con excepciones propias: resources/sonarqube/<component_name>/sonar-project.properties (reemplaza a este).
#
# Formato: una propiedad por línea, clave=valor (sin continuaciones con \). Las líneas con # se ignoran.
# NO poner aquí sonar.projectKey / sonar.projectName (el pipeline usa component_name) ni sonar.host.url / token (vienen de Jenkins).
#
# Estas propiedades SIEMPRE se fuerzan: si no se definen aquí van vacías y anulan lo que ponga el pom.xml
#   sonar.skip (=false), sonar.exclusions, sonar.inclusions, sonar.test.exclusions, sonar.test.inclusions,
#   sonar.coverage.exclusions, sonar.cpd.exclusions, sonar.issue.ignore.multicriteria, sonar.issue.ignore.allfile,
#   sonar.issue.ignore.block, sonar.issue.enforce.multicriteria
#
# NO van aquí (el scanner de Maven las toma del pom.xml de cada micro): sonar.sources, sonar.tests, sonar.java.binaries,
# sonar.java.test.binaries, sonar.java.source. Fijarlas para todos rompería micros multi-módulo o con otra versión de Java.

sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Cobertura: reporte de JaCoCo que genera la fase de tests (si el micro no lo genera, Sonar muestra 0% de cobertura)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Ejemplos (descomentar y ajustar si se necesitan para todos los micros):
# sonar.exclusions=**/generated-sources/**
# sonar.coverage.exclusions=**/*Application.java,**/dto/**
